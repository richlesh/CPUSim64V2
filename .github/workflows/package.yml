name: Build Native Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. 2.1.0)'
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  package:
    strategy:
      matrix:
        include:
          - os: macos-13
            arch: x64
            icon: resources/app_icon.icns
            asm_icon: resources/asm_icon.icns
            obj_icon: resources/obj_icon.icns
            pkg_type: dmg
            label: macos-x64
          - os: macos-latest
            arch: arm64
            icon: resources/app_icon.icns
            asm_icon: resources/asm_icon.icns
            obj_icon: resources/obj_icon.icns
            pkg_type: dmg
            label: macos-arm64
          - os: windows-latest
            arch: x64
            icon: resources/app_icon.ico
            asm_icon: resources/asm_icon.ico
            obj_icon: resources/obj_icon.ico
            pkg_type: msi
            label: windows-x64
          - os: windows-11-arm
            arch: arm64
            icon: resources/app_icon.ico
            asm_icon: resources/asm_icon.ico
            obj_icon: resources/obj_icon.ico
            pkg_type: msi
            label: windows-arm64
          - os: ubuntu-latest
            arch: x64
            icon: resources/app_icon_256.png
            asm_icon: resources/asm_icon_256.png
            obj_icon: resources/obj_icon_256.png
            pkg_type: deb
            label: linux-x64-deb
          - os: ubuntu-latest
            arch: x64
            icon: resources/app_icon_256.png
            asm_icon: resources/asm_icon_256.png
            obj_icon: resources/obj_icon_256.png
            pkg_type: rpm
            label: linux-x64-rpm
          - os: ubuntu-24.04-arm
            arch: arm64
            icon: resources/app_icon_256.png
            asm_icon: resources/asm_icon_256.png
            obj_icon: resources/obj_icon_256.png
            pkg_type: deb
            label: linux-arm64-deb
          - os: ubuntu-24.04-arm
            arch: arm64
            icon: resources/app_icon_256.png
            asm_icon: resources/asm_icon_256.png
            obj_icon: resources/obj_icon_256.png
            pkg_type: rpm
            label: linux-arm64-rpm

    runs-on: ${{ matrix.os }}
    name: Package (${{ matrix.label }})

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build JAR
        run: |
          mvn clean package -DskipTests=true
          mkdir -p lib
          cp target/CPUSim64-*.jar lib/

      - name: Install RPM tools (Linux RPM)
        if: matrix.pkg_type == 'rpm'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Install WiX Toolset (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://github.com/wixtoolset/wix3/releases/download/wix3112rtm/wix311.exe" -OutFile wix311.exe
          Start-Process -Wait -FilePath .\wix311.exe -ArgumentList '/install','/quiet','/norestart'
          echo "C:\Program Files (x86)\WiX Toolset v3.11\bin" >> $env:GITHUB_PATH

      - name: Import Developer ID certificate (macOS)
        if: runner.os == 'macOS'
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=build-keychain-password
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          echo "$CERTIFICATE_BASE64" | base64 --decode -o $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -k $KEYCHAIN_PATH -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychain -d user -s $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

      - name: Create file associations config
        shell: bash
        run: |
          cat > fa-asm.properties <<EOF
          mime-type=application/x-cpusim-asm
          extension=asm
          icon=${{ matrix.asm_icon }}
          description=CPUSim64 Assembly File
          EOF

          cat > fa-obj.properties <<EOF
          mime-type=application/x-cpusim-obj
          extension=obj
          icon=${{ matrix.obj_icon }}
          description=CPUSim64 Object File
          EOF

      - name: Run jpackage
        shell: bash
        run: |
          jpackage \
            --input lib \
            --main-jar CPUSim64-${{ inputs.version }}.jar \
            --name CPUSim64 \
            --app-version "${{ inputs.version }}" \
            --vendor "Richard Lesh" \
            --copyright "(C) 2025-2026 Richard Lesh" \
            --description "64-bit virtual CPU, assembler, and simulation environment" \
            --icon "${{ matrix.icon }}" \
            --file-associations fa-asm.properties \
            --file-associations fa-obj.properties \
            --jlink-options "--strip-debug --no-header-files --no-man-pages --compress zip-6" \
            --type ${{ matrix.pkg_type }}

      - name: Sign and notarize (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG=$(ls *.dmg)
          KEY_FILE=$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8
          echo "${{ secrets.APPLE_API_KEY }}" > "$KEY_FILE"

          # Sign the app inside the DMG
          hdiutil attach "$DMG" -mountpoint /tmp/dmg-mount
          codesign --deep --force --options runtime \
            --sign "Developer ID Application: ${{ secrets.APPLE_TEAM_ID }}" \
            /tmp/dmg-mount/CPUSim64.app
          hdiutil detach /tmp/dmg-mount

          # Sign the DMG itself
          codesign --force --sign "Developer ID Application: ${{ secrets.APPLE_TEAM_ID }}" "$DMG"

          # Notarize
          xcrun notarytool submit "$DMG" \
            --key "$KEY_FILE" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait

          # Staple
          xcrun stapler staple "$DMG"

      - name: Azure login (Windows)
        if: runner.os == 'Windows'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign installer (Windows)
        if: runner.os == 'Windows'
        uses: azure/artifact-signing-action@v1
        with:
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}
          files-folder-filter: msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: CPUSim64-${{ matrix.label }}
          path: |
            *.dmg
            *.msi
            *.deb
            *.rpm

      - name: Attach to release
        if: inputs.version != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version }}
          name: CPUSim64 ${{ inputs.version }}
          files: |
            *.dmg
            *.msi
            *.deb
            *.rpm
