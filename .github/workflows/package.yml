name: Build Native Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. 2.1.0)'
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  package:
    strategy:
      matrix:
        include:
          - os: macos-13
            arch: x64
            icon: resources/app_icon.icns
            asm_icon: resources/asm_icon.icns
            obj_icon: resources/obj_icon.icns
            pkg_type: dmg
            label: macos-x64
          - os: macos-latest
            arch: arm64
            icon: resources/app_icon.icns
            asm_icon: resources/asm_icon.icns
            obj_icon: resources/obj_icon.icns
            pkg_type: dmg
            label: macos-arm64
          - os: windows-latest
            arch: x64
            icon: resources/app_icon.ico
            asm_icon: resources/asm_icon.ico
            obj_icon: resources/obj_icon.ico
            pkg_type: msi
            label: windows-x64
          - os: windows-11-arm
            arch: arm64
            icon: resources/app_icon.ico
            asm_icon: resources/asm_icon.ico
            obj_icon: resources/obj_icon.ico
            pkg_type: msi
            label: windows-arm64
          - os: ubuntu-latest
            arch: x64
            icon: resources/app_icon_256.png
            asm_icon: resources/asm_icon_256.png
            obj_icon: resources/obj_icon_256.png
            pkg_type: deb
            label: linux-x64-deb
          - os: ubuntu-latest
            arch: x64
            icon: resources/app_icon_256.png
            asm_icon: resources/asm_icon_256.png
            obj_icon: resources/obj_icon_256.png
            pkg_type: rpm
            label: linux-x64-rpm
          - os: ubuntu-24.04-arm
            arch: arm64
            icon: resources/app_icon_256.png
            asm_icon: resources/asm_icon_256.png
            obj_icon: resources/obj_icon_256.png
            pkg_type: deb
            label: linux-arm64-deb
          - os: ubuntu-24.04-arm
            arch: arm64
            icon: resources/app_icon_256.png
            asm_icon: resources/asm_icon_256.png
            obj_icon: resources/obj_icon_256.png
            pkg_type: rpm
            label: linux-arm64-rpm

    runs-on: ${{ matrix.os }}
    name: Package (${{ matrix.label }})

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Normalize version
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          echo "APP_VERSION=${VERSION#v}" >> $GITHUB_ENV

      - name: Compile cpusim64 CLI tool
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cl.exe /std:c++17 /O2 /Fe:src/main/resources/cpusim64.exe src/main/cpp/cpusim64.cpp || \
            g++ -std=c++17 -O2 -o src/main/resources/cpusim64.exe src/main/cpp/cpusim64.cpp
          else
            c++ -std=c++17 -O2 -o src/main/resources/cpusim64 src/main/cpp/cpusim64.cpp
          fi

      - name: Build JAR
        run: |
          mvn clean package -DskipTests=true
          mkdir -p lib
          cp target/CPUSim64-*.jar lib/

      - name: Install RPM tools (Linux RPM)
        if: matrix.pkg_type == 'rpm'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Install WiX Toolset (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://github.com/wixtoolset/wix3/releases/download/wix3112rtm/wix311.exe" -OutFile wix311.exe
          Start-Process -Wait -FilePath .\wix311.exe -ArgumentList '/install','/quiet','/norestart'
          echo "C:\Program Files (x86)\WiX Toolset v3.11\bin" >> $env:GITHUB_PATH

      - name: Import Developer ID certificate (macOS)
        if: runner.os == 'macOS'
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=build-keychain-password
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          echo "$CERTIFICATE_BASE64" | base64 --decode -o $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -k $KEYCHAIN_PATH -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychain -d user -s $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

      - name: Create file associations config
        shell: bash
        run: |
          cat > fa-asm.properties <<EOF
          mime-type=application/x-cpusim-asm
          extension=asm
          icon=${{ matrix.asm_icon }}
          description=CPUSim64 Assembly File
          EOF

          cat > fa-obj.properties <<EOF
          mime-type=application/x-cpusim-obj
          extension=obj
          icon=${{ matrix.obj_icon }}
          description=CPUSim64 Object File
          EOF

      - name: Run jpackage
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            # Build app-image first so we can sign before creating DMG
            jpackage \
              --input lib \
              --main-jar CPUSim64-${{ env.APP_VERSION }}.jar \
              --main-class CPUSim64App \
              --name CPUSim64 \
              --app-version "${{ env.APP_VERSION }}" \
              --vendor "Richard Lesh" \
              --copyright "(C) 2025-2026 Richard Lesh" \
              --description "64-bit virtual CPU, assembler, and simulation environment" \
              --icon "${{ matrix.icon }}" \
              --file-associations fa-asm.properties \
              --file-associations fa-obj.properties \
              --jlink-options "--strip-debug --no-header-files --no-man-pages --compress zip-6" \
              --type app-image
          else
            jpackage \
              --input lib \
              --main-jar CPUSim64-${{ env.APP_VERSION }}.jar \
              --main-class CPUSim64App \
              --name CPUSim64 \
              --app-version "${{ env.APP_VERSION }}" \
              --vendor "Richard Lesh" \
              --copyright "(C) 2025-2026 Richard Lesh" \
              --description "64-bit virtual CPU, assembler, and simulation environment" \
              --icon "${{ matrix.icon }}" \
              --file-associations fa-asm.properties \
              --file-associations fa-obj.properties \
              --jlink-options "--strip-debug --no-header-files --no-man-pages --compress zip-6" \
              --type ${{ matrix.pkg_type }}
          fi

      - name: Sign and notarize (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: MMZ3Y97NTP
        run: |
          KEY_FILE=$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8
          echo "${{ secrets.APPLE_API_KEY }}" > "$KEY_FILE"
          IDENTITY="Developer ID Application: RICHARD A LESH (MMZ3Y97NTP)"

          # Debug: show available signing identities
          security find-identity -v -p codesigning $RUNNER_TEMP/build.keychain

          # Sign all nested dylibs and executables first
          find CPUSim64.app -type f \( -name "*.dylib" -o -name "*.jnilib" -o -perm +111 \) | while read f; do
            codesign --force --options runtime --timestamp --sign "$IDENTITY" --keychain $RUNNER_TEMP/build.keychain --entitlements resources/entitlements.plist "$f"
          done

          # Sign the app bundle
          codesign --force --options runtime --timestamp --sign "$IDENTITY" --keychain $RUNNER_TEMP/build.keychain --entitlements resources/entitlements.plist CPUSim64.app

          # Verify signature
          codesign --verify --deep --strict CPUSim64.app

          # Create DMG with Applications alias and volume icon
          DMG_DIR=dmg_contents
          mkdir -p "$DMG_DIR"
          cp -R CPUSim64.app "$DMG_DIR/"
          ln -s /Applications "$DMG_DIR/Applications"
          cp resources/app_icon.icns "$DMG_DIR/.VolumeIcon.icns"

          # Create RW image, set custom icon flag on volume, then convert to compressed
          hdiutil create -volname CPUSim64 -srcfolder "$DMG_DIR" -ov -format UDRW /tmp/cpusim64-rw.dmg
          hdiutil attach /tmp/cpusim64-rw.dmg -mountpoint /tmp/dmg-vol
          SetFile -a C /tmp/dmg-vol
          hdiutil detach /tmp/dmg-vol
          hdiutil convert /tmp/cpusim64-rw.dmg -format UDZO -o CPUSim64-${APP_VERSION}.dmg

          # Sign the DMG
          codesign --force --timestamp --sign "$IDENTITY" --keychain $RUNNER_TEMP/build.keychain CPUSim64-${APP_VERSION}.dmg

          # Notarize
          xcrun notarytool submit CPUSim64-${APP_VERSION}.dmg \
            --key "$KEY_FILE" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait | tee notarize_output.txt

          # Fetch log if notarization failed
          SUBMISSION_ID=$(grep "id:" notarize_output.txt | head -1 | awk '{print $2}')
          if grep -q "Invalid" notarize_output.txt; then
            xcrun notarytool log "$SUBMISSION_ID" \
              --key "$KEY_FILE" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER" || true
            exit 1
          fi

          # Staple
          xcrun stapler staple CPUSim64-${APP_VERSION}.dmg

      - name: Azure login (Windows)
        if: runner.os == 'Windows'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign installer (Windows)
        if: runner.os == 'Windows'
        uses: azure/artifact-signing-action@v1
        with:
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}
          files-folder-filter: msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Rename package with architecture
        shell: bash
        run: |
          for f in *.dmg; do [ -f "$f" ] && mv "$f" "${f%.dmg}-${{ matrix.arch }}.dmg" || true; done
          for f in *.msi; do [ -f "$f" ] && mv "$f" "${f%.msi}-${{ matrix.arch }}.msi" || true; done

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: CPUSim64-${{ matrix.label }}
          path: |
            *.dmg
            *.msi
            *.deb
            *.rpm

      - name: Attach to release
        if: inputs.version != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version }}
          name: CPUSim64 ${{ inputs.version }}
          files: |
            *.dmg
            *.msi
            *.deb
            *.rpm
