name: Build Native Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. 2.10.0)'
        required: true

permissions:
  contents: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  package:
    strategy:
      matrix:
        include:
          - os: macos-latest
            arch: arm64
            icon: ide/src/main/resources/app_icon.icns
            asm_icon: ide/src/main/resources/asm_icon.icns
            o64_icon: ide/src/main/resources/o64_icon.icns
            sym_icon: ide/src/main/resources/sym_icon.icns
            pkg_type: dmg
            label: macos-arm64
          - os: windows-latest
            arch: x64
            icon: ide/src/main/resources/app_icon.ico
            asm_icon: ide/src/main/resources/asm_icon.ico
            o64_icon: ide/src/main/resources/o64_icon.ico
            sym_icon: ide/src/main/resources/sym_icon.ico
            pkg_type: exe
            label: windows-x64
          - os: windows-11-arm
            arch: arm64
            icon: ide/src/main/resources/app_icon.ico
            asm_icon: ide/src/main/resources/asm_icon.ico
            o64_icon: ide/src/main/resources/o64_icon.ico
            sym_icon: ide/src/main/resources/sym_icon.ico
            pkg_type: exe
            label: windows-arm64
          - os: ubuntu-22.04
            arch: x64
            icon: ide/src/main/resources/app_icon_256.png
            asm_icon: ide/src/main/resources/asm_icon_256.png
            o64_icon: ide/src/main/resources/o64_icon_256.png
            sym_icon: ide/src/main/resources/sym_icon_256.png
            pkg_type: deb
            label: linux-x64-deb
          - os: ubuntu-22.04
            arch: x64
            icon: ide/src/main/resources/app_icon_256.png
            asm_icon: ide/src/main/resources/asm_icon_256.png
            o64_icon: ide/src/main/resources/o64_icon_256.png
            sym_icon: ide/src/main/resources/sym_icon_256.png
            pkg_type: rpm
            label: linux-x64-rpm
          - os: ubuntu-24.04-arm
            arch: arm64
            icon: ide/src/main/resources/app_icon_256.png
            asm_icon: ide/src/main/resources/asm_icon_256.png
            o64_icon: ide/src/main/resources/o64_icon_256.png
            sym_icon: ide/src/main/resources/sym_icon_256.png
            pkg_type: deb
            label: linux-arm64-deb
          - os: ubuntu-24.04-arm
            arch: arm64
            icon: ide/src/main/resources/app_icon_256.png
            asm_icon: ide/src/main/resources/asm_icon_256.png
            o64_icon: ide/src/main/resources/o64_icon_256.png
            sym_icon: ide/src/main/resources/sym_icon_256.png
            pkg_type: rpm
            label: linux-arm64-rpm

    runs-on: ${{ matrix.os }}
    name: Package (${{ matrix.label }})

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Normalize version
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          echo "APP_VERSION=${VERSION#v}" >> $GITHUB_ENV

      - name: Import Developer ID certificate (macOS)
        if: runner.os == 'macOS'
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=build-keychain-password
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          echo "$CERTIFICATE_BASE64" | base64 --decode -o $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -k $KEYCHAIN_PATH -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychain -d user -s $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

      - name: Compile cpusim64 CLI tool
        shell: bash
        run: |
          sed -i.bak -E "s/Version [0-9]+\.[0-9]+\.[0-9]+/Version ${APP_VERSION}/" cpusim64/src/main/cpp/cpusim64.cpp
          rm -f cpusim64/src/main/cpp/cpusim64.cpp.bak
          if [ "${{ runner.os }}" = "Windows" ]; then
            cl.exe /std:c++17 /O2 /Fe:ide/src/main/resources/cpusim64.exe cpusim64/src/main/cpp/cpusim64.cpp || \
            g++ -std=c++17 -O2 -static -o ide/src/main/resources/cpusim64.exe cpusim64/src/main/cpp/cpusim64.cpp
          else
            c++ -std=c++17 -O2 -o ide/src/main/resources/cpusim64 cpusim64/src/main/cpp/cpusim64.cpp
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build cpusim64_native (Rust) via Maven
        shell: bash
        run: |
          # Stamp the release version into the native tool's banner constant
          # (mirrors how cpusim64.cpp is versioned above).
          sed -i.bak -E "s/(pub const VERSION: &str = )\"[^\"]*\"/\\1\"${APP_VERSION}\"/" \
            cpusim64_native/src/util.rs
          rm -f cpusim64_native/src/util.rs.bak
          # Build the native simulator through its Maven module (which invokes
          # cargo build --release). Building it first lets macOS sign the binary
          # before it is bundled into the JAR.
          mvn -q -pl cpusim64_native -am package -DskipTests=true
          # Stage the executable + its instructions.data timing file into the IDE
          # resources directory (the same location as the cpusim64 C++ tool), so
          # both ride inside the JAR and are available to the IDE/CLI installer.
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp cpusim64_native/target/release/cpusim64_native.exe ide/src/main/resources/cpusim64_native.exe
          else
            cp cpusim64_native/target/release/cpusim64_native ide/src/main/resources/cpusim64_native
            chmod +x ide/src/main/resources/cpusim64_native
          fi
          cp cpusim64/src/main/resources/instructions.data ide/src/main/resources/instructions.data

      - name: Sign cpusim64 binary (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --force --options runtime --timestamp \
            --sign "Developer ID Application: RICHARD A LESH (MMZ3Y97NTP)" \
            --keychain $RUNNER_TEMP/build.keychain \
            --entitlements resources/entitlements.plist \
            ide/src/main/resources/cpusim64
          codesign --force --options runtime --timestamp \
            --sign "Developer ID Application: RICHARD A LESH (MMZ3Y97NTP)" \
            --keychain $RUNNER_TEMP/build.keychain \
            --entitlements resources/entitlements.plist \
            ide/src/main/resources/cpusim64_native

      - name: Inject license salt
        shell: bash
        run: |
          cat > ide/src/main/java/com/glowingcat/License.java << EOF
          // SPDX-License-Identifier: Apache-2.0
          package com.glowingcat;
          public class License {
              static final String LICENSE_SALT = "${{ secrets.LICENSE_SALT }}";
          }
          EOF

      - name: Build JAR
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            PLATFORM=linux
          elif [ "${{ runner.os }}" = "macOS" ]; then
            PLATFORM=mac-aarch64
          else
            PLATFORM=win
          fi
          # The native simulator was already built (and, on macOS, signed) in a
          # prior step and placed in ide/src/main/resources, so it flows into the
          # JAR via normal resource processing. Skip the module's cargo rebuild /
          # copy here to avoid overwriting the signed binary.
          mvn clean package -P release -DskipTests=true -Dcpusim64.native.skip=true -Dapp.version="${APP_VERSION}" "-Djavafx.platform=$PLATFORM"
          mkdir -p lib
          cp ide/target/CPUSim64IDE-*.jar lib/CPUSim64-${APP_VERSION}.jar
          # Assemble a /bin directory with the native simulator + its timing file.
          mkdir -p bin
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp ide/src/main/resources/cpusim64_native.exe bin/cpusim64_native.exe
          else
            cp ide/src/main/resources/cpusim64_native bin/cpusim64_native
            chmod +x bin/cpusim64_native
          fi
          cp ide/src/main/resources/instructions.data bin/instructions.data
          # jpackage copies the entire --input directory into the installed app's
          # "app/" folder, so placing the native tool + instructions.data in lib/
          # (the --input dir) ships them inside every OS/arch installer alongside
          # the JAR.
          cp bin/* lib/

      - name: Install RPM tools (Linux RPM)
        if: matrix.pkg_type == 'rpm'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Install Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          # Hosted Windows runners may already include Inno Setup (a newer version than
          # we could pin), and choco refuses to downgrade. Use it if present; otherwise install.
          function Find-Iscc {
            foreach ($dir in @("${env:ProgramFiles(x86)}\Inno Setup 6", "$env:ProgramFiles\Inno Setup 6")) {
              if (Test-Path "$dir\ISCC.exe") { return $dir }
            }
            return $null
          }
          $iscc = Find-Iscc
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = Find-Iscc
          }
          if (-not $iscc) { throw "ISCC.exe not found" }
          Write-Host "Using Inno Setup at $iscc"
          echo "$iscc" >> $env:GITHUB_PATH

      - name: Create file associations config
        shell: bash
        run: |
          cat > fa-asm.properties <<EOF
          mime-type=application/x-cpusim-asm
          extension=asm
          icon=${{ matrix.asm_icon }}
          description=CPUSim64 Assembly File
          EOF

          cat > fa-o64.properties <<EOF
          mime-type=application/x-cpusim-o64
          extension=o64
          icon=${{ matrix.o64_icon }}
          description=CPUSim64 Object File
          EOF

          cat > fa-sym.properties <<EOF
          mime-type=application/x-cpusim-sym
          extension=sym
          icon=${{ matrix.sym_icon }}
          description=CPUSim64 Symbol File
          EOF

          cat > fa-sym1.properties <<EOF
          mime-type=application/x-cpusim-sym1
          extension=sym1
          icon=${{ matrix.sym_icon }}
          description=CPUSim64 Symbol File
          EOF

          cat > fa-sym2.properties <<EOF
          mime-type=application/x-cpusim-sym2
          extension=sym2
          icon=${{ matrix.sym_icon }}
          description=CPUSim64 Symbol File
          EOF

          cat > fa-srcmap.properties <<EOF
          mime-type=application/x-cpusim-srcmap
          extension=srcmap
          icon=${{ matrix.sym_icon }}
          description=CPUSim64 Source Map File
          EOF

          cat > fa-def.properties <<EOF
          mime-type=application/x-cpusim-def
          extension=def
          icon=${{ matrix.asm_icon }}
          description=CPUSim64 Definition File
          EOF

      - name: Run jpackage
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            # Build app-image first so we can sign before creating DMG
            jpackage \
              --input lib \
              --main-jar CPUSim64-${{ env.APP_VERSION }}.jar \
              --main-class com.glowingcat.cpusim64ide.IDEApp \
              --name CPUSim64 \
              --app-version "${{ env.APP_VERSION }}" \
              --vendor "Richard Lesh" \
              --copyright "(C) 2025-2026 Richard Lesh" \
              --description "64-bit virtual CPU, assembler, and simulation environment" \
              --icon "${{ matrix.icon }}" \
              --file-associations fa-asm.properties \
              --file-associations fa-o64.properties \
              --file-associations fa-sym.properties \
              --file-associations fa-sym1.properties \
              --file-associations fa-sym2.properties \
              --file-associations fa-srcmap.properties \
              --file-associations fa-def.properties \
              --jlink-options "--strip-debug --no-header-files --no-man-pages --compress zip-6" \
              --resource-dir resources/macos \
              --type app-image
          elif [ "${{ runner.os }}" = "Linux" ]; then
            # Build app-image first so we can remove ALSA-linked native libs
            jpackage \
              --input lib \
              --main-jar CPUSim64-${{ env.APP_VERSION }}.jar \
              --main-class com.glowingcat.cpusim64ide.IDEApp \
              --name CPUSim64 \
              --app-version "${{ env.APP_VERSION }}" \
              --vendor "Richard Lesh" \
              --copyright "(C) 2025-2026 Richard Lesh" \
              --description "64-bit virtual CPU, assembler, and simulation environment" \
              --icon "${{ matrix.icon }}" \
              --jlink-options "--strip-debug --no-header-files --no-man-pages --compress zip-6" \
              --java-options "-Dawt.useSystemAAFontSettings=on" \
              --type app-image

            # Remove native sound libraries to eliminate libasound2 dependency
            find CPUSim64 -name "libjsound*.so" -delete

            # Package from the app-image
            jpackage \
              --app-image CPUSim64 \
              --name CPUSim64 \
              --app-version "${{ env.APP_VERSION }}" \
              --vendor "Richard Lesh" \
              --copyright "(C) 2025-2026 Richard Lesh" \
              --description "64-bit virtual CPU, assembler, and simulation environment" \
              --icon "${{ matrix.icon }}" \
              --file-associations fa-asm.properties \
              --file-associations fa-o64.properties \
              --file-associations fa-sym.properties \
              --file-associations fa-sym1.properties \
              --file-associations fa-sym2.properties \
              --file-associations fa-srcmap.properties \
              --file-associations fa-def.properties \
              --linux-app-category devel \
              --linux-menu-group "Development;IDE;" \
              --resource-dir resources/linux \
              --type ${{ matrix.pkg_type }}
          else
            jpackage \
              --input lib \
              --main-jar CPUSim64-${{ env.APP_VERSION }}.jar \
              --main-class com.glowingcat.cpusim64ide.IDEApp \
              --name CPUSim64 \
              --app-version "${{ env.APP_VERSION }}" \
              --vendor "Richard Lesh" \
              --copyright "(C) 2025-2026 Richard Lesh" \
              --description "64-bit virtual CPU, assembler, and simulation environment" \
              --icon "${{ matrix.icon }}" \
              --jlink-options "--strip-debug --no-header-files --no-man-pages --compress zip-6" \
              --type app-image
          fi

      - name: Build Inno Setup installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # jpackage produced the CPUSim64\ app-image above; wrap it in an Inno Setup
          # installer that supports /ALLUSERS and /CURRENTUSER on the command line.
          ISCC.exe "/DAppVersion=${{ env.APP_VERSION }}" "/DArch=${{ matrix.arch }}" `
            "/DRepoRoot=$env:GITHUB_WORKSPACE" "/DAppImageDir=$env:GITHUB_WORKSPACE\CPUSim64" `
            "/DOutputDir=$env:GITHUB_WORKSPACE" resources\windows\CPUSim64.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      - name: Sign and notarize (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: MMZ3Y97NTP
        run: |
          KEY_FILE=$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8
          echo "${{ secrets.APPLE_API_KEY }}" > "$KEY_FILE"
          IDENTITY="Developer ID Application: RICHARD A LESH (MMZ3Y97NTP)"

          # Debug: show available signing identities
          security find-identity -v -p codesigning $RUNNER_TEMP/build.keychain

          # Sign all nested dylibs and executables first
          find CPUSim64.app -type f \( -name "*.dylib" -o -name "*.jnilib" -o -perm +111 \) | while read f; do
            codesign --force --options runtime --timestamp --sign "$IDENTITY" --keychain $RUNNER_TEMP/build.keychain --entitlements resources/entitlements.plist "$f"
          done

          # Sign the app bundle
          codesign --force --options runtime --timestamp --sign "$IDENTITY" --keychain $RUNNER_TEMP/build.keychain --entitlements resources/entitlements.plist CPUSim64.app

          # Verify signature
          codesign --verify --deep --strict CPUSim64.app

          # Create DMG with Applications alias and volume icon
          DMG_DIR=dmg_contents
          mkdir -p "$DMG_DIR"
          cp -R CPUSim64.app "$DMG_DIR/"
          ln -s /Applications "$DMG_DIR/Applications"
          cp ide/src/main/resources/app_icon.icns "$DMG_DIR/.VolumeIcon.icns"

          # Create RW image, set custom icon flag on volume, then convert to compressed
          hdiutil create -volname CPUSim64 -srcfolder "$DMG_DIR" -ov -format UDRW /tmp/cpusim64-rw.dmg
          hdiutil attach /tmp/cpusim64-rw.dmg -mountpoint /tmp/dmg-vol
          SetFile -a C /tmp/dmg-vol
          hdiutil detach /tmp/dmg-vol
          hdiutil convert /tmp/cpusim64-rw.dmg -format UDZO -o CPUSim64-${APP_VERSION}.dmg

          # Sign the DMG
          codesign --force --timestamp --sign "$IDENTITY" --keychain $RUNNER_TEMP/build.keychain CPUSim64-${APP_VERSION}.dmg

          # Notarize
          xcrun notarytool submit CPUSim64-${APP_VERSION}.dmg \
            --key "$KEY_FILE" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait | tee notarize_output.txt

          # Fetch log if notarization failed
          SUBMISSION_ID=$(grep "id:" notarize_output.txt | head -1 | awk '{print $2}')
          if grep -q "Invalid" notarize_output.txt; then
            xcrun notarytool log "$SUBMISSION_ID" \
              --key "$KEY_FILE" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER" || true
            exit 1
          fi

          # Staple
          xcrun stapler staple CPUSim64-${APP_VERSION}.dmg

      - name: Azure login (Windows)
        if: runner.os == 'Windows'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign installer (Windows)
        if: runner.os == 'Windows'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Rename package with architecture
        shell: bash
        run: |
          for f in *.dmg; do [ -f "$f" ] && mv "$f" "${f%.dmg}-${{ matrix.arch }}.dmg" || true; done
          # Windows .exe installers are already named CPUSim64-<version>-<arch>.exe by Inno Setup.

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: CPUSim64-${{ matrix.label }}
          path: |
            *.dmg
            *.exe
            *.deb
            *.rpm

      - name: Attach to release
        if: inputs.version != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version }}
          name: CPUSim64 ${{ inputs.version }}
          files: |
            *.dmg
            *.exe
            *.deb
            *.rpm
