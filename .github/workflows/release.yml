name: Build and Release Jar

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. 2.7.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Inject license salt
        run: |
          cat > ide/src/main/java/com/glowingcat/License.java << EOF
          // SPDX-License-Identifier: Apache-2.0
          package com.glowingcat;
          public class License {
              static final String LICENSE_SALT = "${{ secrets.LICENSE_SALT }}";
          }
          EOF

      - name: Build JAR
        run: |
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          mvn clean package -P release -DskipTests=true
          mkdir -p lib
          cp ide/target/CPUSim64IDE-*.jar lib/CPUSim64-${VERSION}.jar

      - name: Create distribution zip
        run: |
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          mkdir -p CPUSim64
          cp -r *.sh *.bat lib cpusim64/src/main/resources/documentation NOTICE LICENSE README.md CPUSim64/
          zip -r "cpusim64-${VERSION}-java.zip" CPUSim64 \
            -x "**/.DS_Store"
          rm -rf CPUSim64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version }}
          name: CPUSim64 ${{ inputs.version }}
          files: cpusim64-*-java.zip
