name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. 2.4.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Inject license salt
        run: |
          cat > src/main/java/License.java << EOF
          // SPDX-License-Identifier: Apache-2.0
          public class License {
              static final String LICENSE_SALT = "${{ secrets.LICENSE_SALT }}";
          }
          EOF

      - name: Build JAR
        run: |
          mvn clean package -DskipTests=true
          mkdir -p lib
          cp target/CPUSim64*.jar lib/

      - name: Create distribution zip
        run: |
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          zip -r "cpusim64-${VERSION}-java.zip" \
            pom.xml \
            *.sh \
            lib \
            documentation \
            NOTICE \
            LICENSE \
            README.md \
            -x "**/.DS_Store"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version }}
          name: CPUSim64 ${{ inputs.version }}
          files: cpusim64-*-java.zip

