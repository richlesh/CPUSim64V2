name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. 2.2.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build JAR
        run: |
          mvn clean package -DskipTests=true
          mkdir -p lib
          cp target/CPUSim64*.jar lib/

      - name: Create distribution zip
        run: |
          zip -r CPUSim64V2.zip \
            pom.xml \
            *.sh \
            lib \
            src \
            documentation \
            NOTICE \
            LICENSE \
            README.md \
            -x "**/.DS_Store"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version }}
          name: CPUSim64 ${{ inputs.version }}
          files: CPUSim64V2.zip

