# IBM watsonx.ai Configuration
# Set API Key field to your IBM Cloud IAM API key
# Replace YOUR_PROJECT_ID with your watsonx.ai project ID
# Replace region if needed (us-south, eu-de, eu-gb, jp-tok)
Auth:
  TokenURI: https://iam.cloud.ibm.com/identity/token
  Method: POST
  Headers:
    Content-Type: application/x-www-form-urlencoded
  Body: "grant_type=urn:ibm:params:oauth:grant-type:apikey&apikey=${AUTH_TOKEN}"
  Response:
    TokenPath: "access_token"
    ExpiresInPath: "expires_in"
Prompt:
  URI: https://us-south.ml.cloud.ibm.com/ml/v1/text/chat?version=2024-10-08
  Method: POST
  Headers:
    Content-Type: application/json
    Accept: application/json
    Authorization: "Bearer ${AUTH_TOKEN}"
  ConversationMode: multi-turn
  Body: |
    {
      "model_id": "${MODEL}",
      "project_id": "YOUR_PROJECT_ID",
      "messages": ${MESSAGES},
      "max_tokens": 4096,
      "temperature": 0,
      "stream": false
    }
  Response:
    ContentPath: "choices[0].message.content"

Models:
  URI: https://us-south.ml.cloud.ibm.com/ml/v1/foundation_model_specs?version=2024-10-10&filters=function_text_chat&limit=200
  Method: GET
  Headers:
    Authorization: "Bearer ${AUTH_TOKEN}"
  Response:
    ListPath: "resources"
    IdField: "model_id"
    DescriptionField: "label"

Embedding:
  URI: https://us-south.ml.cloud.ibm.com/ml/v1/text/embeddings?version=2024-10-08
  Model: ibm/slate-125m-english-rtrvr-v2
